[project]
name = "samhita"
version = "0.1.0"
description = "Composable KV-cache codec framework: stages, not codecs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "safetensors>=0.4",
]

[project.optional-dependencies]
capture = ["transformers>=4.40", "datasets>=2.19"]
harness = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
