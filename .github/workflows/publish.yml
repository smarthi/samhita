name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crate version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; data = json.load(sys.stdin); print(next(pkg["version"] for pkg in data["packages"] if pkg["name"] == "samhita-core"))')"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match crate version ($CRATE_VERSION)."
            exit 1
          fi

      - name: Publish samhita-core
        run: cargo publish -p samhita-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    needs: publish-crates
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          rm -rf dist
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built package version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PY_VERSION="$(python -c 'from pathlib import Path; versions = set(); \
for path in Path("dist").glob("*"): \
    name = path.name; \
    if name.startswith("samhita-") and name.endswith(".tar.gz"): versions.add(name[len("samhita-"):-len(".tar.gz")]); \
    elif name.startswith("samhita-") and name.endswith(".whl"): versions.add(name.split("-")[1]); \
assert len(versions) == 1, f\"Could not determine unique version from dist/: {sorted(versions)}\"; \
print(next(iter(versions)))')"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Python package version ($PY_VERSION)."
            exit 1
          fi

      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
