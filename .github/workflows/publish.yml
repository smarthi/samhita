name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crate version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; data = json.load(sys.stdin); print(next(pkg["version"] for pkg in data["packages"] if pkg["name"] == "samhita-core"))')"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match crate version ($CRATE_VERSION)."
            exit 1
          fi

      - name: Backfill crates.io description for older tags
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          path = Path("crates/core/Cargo.toml")
          text = path.read_text()
          description = "Composable KV-cache codec framework core traits and pipeline"

          package = tomllib.loads(text).get("package", {})
          if isinstance(package.get("description"), str) and package["description"].strip():
              raise SystemExit(0)

          newline = "\r\n" if "\r\n" in text else "\n"
          lines = text.splitlines(keepends=True)
          for index, line in enumerate(lines):
              if line.strip() == "[package]":
                  lines.insert(index + 1, f'description = "{description}"{newline}')
                  path.write_text("".join(lines))
                  print(f"Added missing description to {path} for publish.")
                  raise SystemExit(0)

          raise SystemExit(f"Expected to find [package] section in {path}")
          PY

      - name: Publish samhita-core
        run: cargo publish -p samhita-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    needs: publish-crates
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          rm -rf dist
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built package version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PY_VERSION="$(python - <<'PY'
          import tarfile
          from email.parser import Parser
          from pathlib import Path

          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(sdists) == 1, f"Expected one sdist in dist/, found: {[p.name for p in sdists]}"
          with tarfile.open(sdists[0]) as tf:
              member = next((m for m in tf.getmembers() if m.name.endswith("/PKG-INFO") and m.name.count("/") == 1), None)
              assert member is not None, f"PKG-INFO not found in {sdists[0].name}"
              metadata = Parser().parsestr(tf.extractfile(member).read().decode("utf-8"))
          print(metadata["Version"])
          PY
          )"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Python package version ($PY_VERSION)."
            exit 1
          fi

      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive --verbose dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
