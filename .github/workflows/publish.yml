name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-crates:
    name: Publish crate to crates.io
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crate version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | python -c 'import json, sys; data = json.load(sys.stdin); print(next(pkg["version"] for pkg in data["packages"] if pkg["name"] == "samhita-core"))')"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match crate version ($CRATE_VERSION)."
            exit 1
          fi

      - name: Backfill crates.io description for older tags
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/core/Cargo.toml")
          text = path.read_text()

          if "description =" in text:
              raise SystemExit(0)

          marker = 'license.workspace = true\n'
          description = 'description = "Composable KV-cache codec framework core traits and pipeline"\n'
          if marker not in text:
              raise SystemExit(f"Expected to find {marker!r} in {path}")

          path.write_text(text.replace(marker, marker + description, 1))
          print(f"Added missing description to {path} for publish.")
          PY

      - name: Publish samhita-core
        run: cargo publish -p samhita-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    needs: publish-crates
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          rm -rf dist
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built package version matches tag
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PY_VERSION="$(python -c 'import tarfile; from email.parser import Parser; from pathlib import Path; sdists = list(Path("dist").glob("*.tar.gz")); assert len(sdists) == 1, f\"Expected one sdist in dist/, found: {[p.name for p in sdists]}\"; sdist = sdists[0]; tf = tarfile.open(sdist); pkg_info = next((member for member in tf.getmembers() if member.name.endswith(\"PKG-INFO\")), None); assert pkg_info is not None, f\"PKG-INFO not found in {sdist.name}\"; metadata = Parser().parsestr(tf.extractfile(pkg_info).read().decode(\"utf-8\")); tf.close(); print(metadata[\"Version\"])')"
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Python package version ($PY_VERSION)."
            exit 1
          fi

      - name: Publish to PyPI
        run: |
          python -m pip install --upgrade twine
          python -m twine upload --non-interactive dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
